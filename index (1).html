<script>
(function () {
  // Cache DOM elements explicitly
  const accountEl = document.getElementById('account');
  const durationEl = document.getElementById('duration');
  const statusEl = document.getElementById('status');
  const timerEl = document.getElementById('timer');
  const startBtn = document.getElementById('start');
  const historyEl = document.getElementById('history');
  const photoEl = document.getElementById('photo');
  const avatarEl = document.getElementById('avatar');
  const emailEl = document.getElementById('email');
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const password2El = document.getElementById('password2');
  const nameEl = document.getElementById('name');
  const profileStatusEl = document.getElementById('profileStatus');

  // Safe escaping for HTML
  function safe(x) {
    return String(x).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
  }

  // Robust localStorage helpers
  function loadReports() {
    try {
      return JSON.parse(localStorage.getItem('reports') || '[]');
    } catch (e) {
      console.warn('Failed to parse reports from localStorage, resetting', e);
      localStorage.removeItem('reports');
      return [];
    }
  }
  function saveReports(arr) {
    try {
      localStorage.setItem('reports', JSON.stringify(arr));
    } catch (e) {
      console.warn('Failed to save reports', e);
    }
  }

  // Render history safely
  function render() {
    const d = loadReports();
    if (!d || d.length === 0) {
      historyEl.textContent = 'Belum ada riwayat.';
      return;
    }
    historyEl.innerHTML = d.map(x =>
      '<div class="item"><b>' + safe(x.id) + '</b> — ' + safe(x.duration) +
      '<br><small>' + safe(x.time) + '</small></div>').join('');
  }

  // Clear history
  window.clearHistory = function () {
    localStorage.removeItem('reports');
    render();
  };

  // Color choice (keeps existing API)
  window.color = function (c) {
    const el = document.getElementById('color');
    if (el) el.textContent = 'Warna saat ini: ' + c;
  };

  // Save profile with simple validation
  window.saveProfile = function () {
    const e = (emailEl && emailEl.value || '').trim();
    if (!e || !e.includes('@')) {
      profileStatusEl.className = 'status error';
      profileStatusEl.setAttribute('aria-live', 'polite');
      profileStatusEl.textContent = 'Email wajib diisi dengan benar.';
      return;
    }
    const profile = {
      username: usernameEl.value || '',
      name: nameEl.value || '',
      email: e
    };
    try {
      localStorage.setItem('profile', JSON.stringify(profile));
      profileStatusEl.className = 'status success';
      profileStatusEl.setAttribute('aria-live', 'polite');
      profileStatusEl.textContent = 'Profil tersimpan.';
    } catch (err) {
      profileStatusEl.className = 'status error';
      profileStatusEl.textContent = 'Gagal menyimpan profil.';
    }
  };

  // Photo change handler — store small images as DataURL (demo only)
  if (photoEl) {
    photoEl.addEventListener('change', function (ev) {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      // Optional: size guard (e.g., 200 KB)
      const MAX_BYTES = 200 * 1024;
      if (f.size > MAX_BYTES) {
        alert('File terlalu besar. Pilih gambar lebih kecil (<=200KB) untuk demo.');
        return;
      }
      const r = new FileReader();
      r.onload = function () {
        try {
          avatarEl.src = r.result;
          localStorage.setItem('avatar', r.result);
        } catch (e) {
          console.warn('Failed to store avatar', e);
        }
      };
      r.readAsDataURL(f);
    });
  }

  // Timer / demo runner
  let timerId = null;
  window.startDemo = function () {
    const id = (accountEl && accountEl.value || '').trim();
    if (!id) {
      statusEl.className = 'status error';
      statusEl.setAttribute('aria-live', 'polite');
      statusEl.textContent = 'Masukkan ID akun untuk simulasi.';
      return;
    }

    // Prevent double start
    startBtn.disabled = true;
    let remaining = 20;
    timerEl.textContent = remaining;
    statusEl.className = 'status';
    statusEl.setAttribute('aria-live', 'polite');
    statusEl.textContent = 'Simulasi berjalan...';

    timerId = setInterval(() => {
      remaining -= 1;
      timerEl.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        statusEl.className = 'status success';
        statusEl.textContent = 'Simulasi selesai.';
        // Save report to history
        const reports = loadReports();
        reports.unshift({
          id: id,
          duration: (durationEl && durationEl.value) || '',
          time: new Date().toLocaleString()
        });
        saveReports(reports);
        render();
        startBtn.disabled = false;
      }
    }, 1000);
  };

  // Initialize UI on load
  function init() {
    render();
    if (localStorage.avatar) {
      avatarEl.src = localStorage.avatar;
    }
    try {
      const p = JSON.parse(localStorage.getItem('profile') || '{}');
      usernameEl.value = p.username || '';
      nameEl.value = p.name || '';
      emailEl.value = p.email || '';
    } catch (e) {
      // ignore
    }
    // Make sure status is accessible to screen readers
    statusEl.setAttribute('role', 'status');
    profileStatusEl.setAttribute('role', 'status');
  }

  // Expose some functions globally used by inline onClick attributes
  window.render = render;

  // Run init
  init();
})();
</script>
