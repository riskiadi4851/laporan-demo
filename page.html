<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      max-width: 400px;
      width: 90%;
    }
    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #4285f4;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .download:hover { background: #3367d6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Download</h1>
    <p>File siap untuk diunduh.</p>
    <a class="download" href="file.zip" download>Download File</a>
  </div>
</body>
</html>
